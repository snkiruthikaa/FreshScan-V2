<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product - FreshScan</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
            padding: 40px;
        }
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { color: #4361ee; font-size: 28px; }
        .form-group { margin-bottom: 25px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #2d3436; }
        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 16px;
            font-family: inherit;
        }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #4361ee; }
        .btn {
            background: linear-gradient(135deg, #4361ee, #3a0ca3);
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(67, 97, 238, 0.3); }
        .back-link { display: inline-block; margin-bottom: 20px; color: #4361ee; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .message { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; }
        .success { background: rgba(46, 196, 182, 0.1); color: #2ec4b6; border: 1px solid rgba(46, 196, 182, 0.3); }
        .error { background: rgba(231, 29, 54, 0.1); color: #e71d36; border: 1px solid rgba(231, 29, 54, 0.3); }
        .date-hint {
            font-size: 12px;
            color: #e71d36;
            margin-top: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin" class="back-link"><i class="fas fa-arrow-left"></i> Back to Admin</a>
        <div class="header">
            <h1><i class="fas fa-edit"></i> Edit Product</h1>
            <p style="color: #6c757d; margin-top: 10px;">Update product information</p>
        </div>
        
        <form id="editForm">
            <div class="form-group">
                <label>Product Name *</label>
                <input type="text" id="product_name" name="product_name" value="{{ product[1] }}" required>
            </div>
            <div class="form-group">
                <label>Batch ID *</label>
                <input type="text" id="batch_id" name="batch_id" value="{{ product[2] }}" required>
            </div>
            <div class="form-group">
                <label>Category *</label>
                <select id="category" name="category" required>
                    <option value="">Select Category</option>
                    {% for category in categories %}
                    <option value="{{ category[0] }}" {% if category[0] == product[3] %}selected{% endif %}>
                        {{ category[1] }} {{ category[0] }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Manufacturing Date *</label>
                    <input type="date" id="mfg_date" name="mfg_date" value="{{ product[4] }}" required>
                </div>
                <div class="form-group">
                    <label>Expiry Date *</label>
                    <input type="date" id="expiry_date" name="expiry_date" value="{{ product[5] }}" required>

                </div>
            </div>
            
            <div class="form-group">
                <label>Storage Instructions (Optional)</label>
                <textarea id="storage_instructions" name="storage_instructions" rows="3">{{ product[6] or '' }}</textarea>
            </div>
            <button type="submit" class="btn">
                <i class="fas fa-save"></i> Update Product
            </button>
            <div id="message" class="message"></div>
        </form>
    </div>
    
    <script>
        document.getElementById('editForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const messageDiv = document.getElementById('message');
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.innerHTML;
            
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Updating...';
            submitBtn.disabled = true;
            messageDiv.style.display = 'none';
            
            try {
                const response = await fetch(window.location.href, {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                
                if (result.success) {
                    messageDiv.innerHTML = '<div class="success"><i class="fas fa-check-circle"></i> ✅ Product updated successfully! Redirecting...</div>';
                    messageDiv.style.display = 'block';
                    setTimeout(() => { window.location.href = '/admin'; }, 1500);
                } else {
                    messageDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-circle"></i> ❌ Error: ${result.error}</div>`;
                    messageDiv.style.display = 'block';
                }
            } catch (error) {
                messageDiv.innerHTML = `<div class="error"><i class="fas fa-exclamation-triangle"></i> ❌ Error: ${error.message}</div>`;
                messageDiv.style.display = 'block';
            } finally {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
        });
        
        // REMOVE ALL DATE RESTRICTIONS - Allow ANY date (past, present, future)
        document.addEventListener('DOMContentLoaded', function() {
            const mfgInput = document.getElementById('mfg_date');
            const expiryInput = document.getElementById('expiry_date');
            
            // Remove min/max restrictions from both date inputs
            if (mfgInput) {
                mfgInput.removeAttribute('min');
                mfgInput.removeAttribute('max');
            }
            if (expiryInput) {
                expiryInput.removeAttribute('min');
                expiryInput.removeAttribute('max');
            }
            
            console.log("✅ Date restrictions removed - can select ANY date!");
        });
    </script>
</body>
</html>
